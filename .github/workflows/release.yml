name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION but package.json declares $VERSION."
            exit 1
          fi
          echo "Tag and package.json agree on version $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Last gate before an irreversible publish. See the equivalent step in
      # ci.yml for why asserting on the built output (not the source) is the
      # only thing that catches a missing `__PKG_VERSION__` define.
      - name: Verify dist loads and reports the right version
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts
          node -e "
            const { VERSION, createIAP } = require('./dist/index.cjs');
            const { version } = require('./package.json');
            if (typeof createIAP !== 'function') throw new Error('CJS: createIAP missing');
            if (VERSION !== version) throw new Error(\`CJS: VERSION '\${VERSION}' != package.json '\${version}'\`);
            console.log('CJS OK', VERSION);
          "
          node --input-type=module -e "
            import { VERSION, createIAP } from './dist/index.js';
            import { createRequire } from 'node:module';
            const { version } = createRequire(import.meta.url)('./package.json');
            if (typeof createIAP !== 'function') throw new Error('ESM: createIAP missing');
            if (VERSION !== version) throw new Error(\`ESM: VERSION '\${VERSION}' != package.json '\${version}'\`);
            console.log('ESM OK', VERSION);
          "

      - name: Check if version is already on npm
        id: published_check
        run: |
          if npm view "@nosslabs/iap@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::@nosslabs/iap@$VERSION is already published — skipping publish step."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm via OIDC trusted publishing
        if: steps.published_check.outputs.skip != 'true'
        run: |
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          echo "Publishing $VERSION on dist-tag $DIST_TAG"
          npm publish --access public --tag "$DIST_TAG"

      # ─── Notification: published successfully ──────────────────────────
      - name: Discord — published
        if: success() && steps.published_check.outputs.skip != 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "Published @nosslabs/iap@${{ env.VERSION }}"
          description: |
            Released to npm with provenance. Install with:
            ```
            npm install @nosslabs/iap@${{ env.VERSION }}
            ```
          version: v${{ env.VERSION }}
          extra_fields: |
            [
              { "name": "npm",     "value": "[@nosslabs/iap on npmjs.com](https://www.npmjs.com/package/@nosslabs/iap/v/${{ env.VERSION }})", "inline": true },
              { "name": "Release", "value": "[GitHub release](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ env.VERSION }})", "inline": true }
            ]

      # ─── Notification: idempotent re-run (already on registry) ────────
      - name: Discord — already published
        if: success() && steps.published_check.outputs.skip == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: info
          title: "Workflow re-ran for @nosslabs/iap@${{ env.VERSION }}"
          description: |
            Version is already on npm. Idempotency guard fired — no re-publish.
          version: v${{ env.VERSION }}
          extra_fields: |
            [
              { "name": "npm", "value": "[@nosslabs/iap on npmjs.com](https://www.npmjs.com/package/@nosslabs/iap/v/${{ env.VERSION }})", "inline": true }
            ]

      # ─── Notification: failure (any step) ──────────────────────────────
      - name: Discord — failed
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "Release FAILED for @nosslabs/iap@${{ env.VERSION }}"
          description: |
            ⚠️  Release of `@nosslabs/iap@${{ env.VERSION }}` did not complete. Check the workflow logs for the failing step.
          version: v${{ env.VERSION }}
