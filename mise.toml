[tools]
node = "22.22.2"
npm = "11.13.0"

[tasks.publish]
description = "Bump package.json version, commit, tag, and push to trigger the release workflow"
run = """
#!/usr/bin/env bash
set -euo pipefail

if [[ $# -lt 1 ]]; then
  echo 'Usage: mise run publish <version>     (e.g., mise run publish 7.0.0-next.0 from main, or 5.0.1 from the 5.x branch)' >&2
  exit 64
fi

# Allow either "0.1.0" or "v0.1.0"; canonicalize to bare SemVer.
VERSION="${1#v}"

if [[ ! "$VERSION" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
  echo "Error: '$VERSION' is not a valid SemVer (expected MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-prerelease)." >&2
  exit 65
fi

# Hard-fail on a dirty tree — npm version + git commit would either no-op or capture unrelated changes.
if [[ -n "$(git status --porcelain)" ]]; then
  echo 'Error: working tree is dirty. Commit or stash before publishing.' >&2
  git status --short
  exit 1
fi

# Branch policy (Capacitor-aligned versioning, see memory
# "Versioning + branch model — Capacitor-aligned"):
# - `main` = current in-dev Capacitor major; accepts stable AND prerelease.
# - `<major>.x` = maintenance branch (e.g. `5.x`, `7.x`); accepts stable
#   releases whose major matches the branch (e.g. `5.0.1` from `5.x`).
# - Prereleases (version contains `-`) come from `main` only.
# `release.yml` auto-publishes `*-*` versions on the `@next` dist-tag.
BRANCH="$(git rev-parse --abbrev-ref HEAD)"
IS_PRERELEASE=false
[[ "$VERSION" == *-* ]] && IS_PRERELEASE=true
VERSION_MAJOR="${VERSION%%.*}"

if [[ "$BRANCH" == 'main' ]]; then
  :  # the in-dev major lives here; both stable and prerelease are fine
elif [[ "$BRANCH" =~ ^[0-9]+[.]x$ ]]; then
  if [[ "$IS_PRERELEASE" == 'true' ]]; then
    echo "Error: prereleases must be cut from 'main', not the '$BRANCH' maintenance branch." >&2
    exit 1
  fi
  MAINT_MAJOR="${BRANCH%.x}"
  if [[ "$MAINT_MAJOR" != "$VERSION_MAJOR" ]]; then
    echo "Error: on '$BRANCH' but $VERSION targets major $VERSION_MAJOR (expected ${MAINT_MAJOR}.y.z)." >&2
    exit 1
  fi
  echo "→ Publishing stable $VERSION from the '$BRANCH' maintenance branch."
else
  echo "Error: on '$BRANCH'. Publish from 'main' (any version) or '<major>.x' (matching stable only)." >&2
  exit 1
fi

# Hard-fail if the tag already exists locally or on the remote — re-tagging is rarely what you want.
if git rev-parse "v$VERSION" >/dev/null 2>&1; then
  echo "Error: tag v$VERSION already exists locally." >&2
  exit 1
fi
if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
  echo "Error: tag v$VERSION already exists on origin." >&2
  exit 1
fi

echo "→ Bumping package.json to $VERSION"
npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null

echo '→ Committing version bump'
git add package.json package-lock.json
git commit -m "chore(release): v$VERSION"

echo "→ Tagging v$VERSION"
git tag -a "v$VERSION" -m "Release $VERSION"

echo "→ Pushing $BRANCH + tag to origin"
git push origin "$BRANCH"
git push origin "v$VERSION"

echo ''
echo "✓ Pushed v$VERSION. The release workflow will build, test, and publish to npm."
echo '  Watch: https://github.com/nossdev/iap/actions/workflows/release.yml'
"""
